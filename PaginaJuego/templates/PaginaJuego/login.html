{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/x-icon" href="{% static 'images/logo.png' %}">
    <title>Roguelike De Malvinas - Iniciar Sesión</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/inicio.css' %}">
</head>
<body>

    <nav class="navbar navbar-expand-lg custom-navbar">
        <div class="container-fluid">
            <a class="navbar-brand" href="{% url 'index' %}">Roguelike De Malvinas</a>
            <div class="navbar-nav gap-3 ms-auto">
                <a class="nav-link" href="{% url 'index' %}">Inicio</a>
            </div>
        </div>
    </nav>

    <div class="container my-5">
        <div class="row justify-content-center">
            <div class="col-12 col-md-6 col-lg-5">
                <div class="card-custom p-4">
                    <h2 class="titulo-principal mb-4">INICIAR SESIÓN</h2>
                    <form method="POST">
                        {% csrf_token %}
                        <div class="mb-3">
                            <label class="form-label fw-bold">Nombre de usuario</label>
                            <input type="text" name="username" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-bold">Contraseña</label>
                            <input type="password" name="password" class="form-control" required>
                        </div>
                        <button type="submit" class="btn btn-warning fw-bold w-100 py-2">Ingresar</button>
                    </form>
                    <p class="mt-3 text-center mb-0">
                        ¿No tenés cuenta? <a href="{% url 'registro' %}" class="text-warning fw-bold">Registrate acá</a>
                    </p>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
